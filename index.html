
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>旧校舎の謎</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ゲーム画面 -->
  <main id="gameScreen" class="screen">
    <div id="timer" aria-label="残り時間">10:00</div>

    <!-- 長押しして音声認識する画像ボタン -->
    <button id="imageButton" type="button"
            aria-label="ボタンを長押しして音声認識">
      <img src="botton.png" alt="音声認識ボタン"
           draggable="false">
    </button>

    <!-- 認識成功時だけ文章を表示 -->
    <div id="voiceResult" aria-live="polite"></div>

    <!-- エピローグ再生ボタン -->
    <button id="epilogueButton" type="button">
      エピローグ
    </button>

    <!-- エピローグ2再生ボタン -->
    <button id="epilogue2Button" type="button">
      エピローグ2
    </button>
  </main>

  <!-- エピローグ画面 -->
  <section id="epilogueScreen" class="screen hidden"
           aria-label="エピローグ">
    <div class="epilogue-shade"></div>

    <div id="epilogueViewport">
      <h1 id="epilogueTitle">EPILOGUE</h1>
      <div id="epilogueText"></div>
    </div>

    <button id="closeEpilogueButton" type="button">
      戻る
    </button>

    <div id="skipHint">画面右下の「戻る」でゲームに戻る</div>
  </section>

  <script src="script.js"></script>
</body>
</html>
