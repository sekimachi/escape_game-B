<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>脱出ゲーム</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==================================================
       ゲーム画面
  =================================================== -->

  <main id="gameScreen" class="screen">

    <!-- タイマー -->
    <div id="timer">
      12:00
    </div>

    <!-- エピローグをもう一度見る -->
    <button
      id="epilogueButton"
      type="button"
    >
      エピローグ
    </button>

  </main>


  <!-- ==================================================
       エピローグ画面
  =================================================== -->

  <section
    id="epilogueScreen"
    class="screen"
  >

    <!-- タイトル -->
    <div id="epilogueTitle">
      ― EPILOGUE ―
    </div>


    <!-- 文章表示領域 -->
    <div id="epilogueViewport">

      <div id="epilogueText">

主人公は、今大学4年生で、社会系の研究室で活動を行っている。

その研究室は6人在籍しており、個々で将来がかかった大きな研究をしている。

そしてその研究発表会が明日に迫っていた。

しかし、研究発表直前に研究資料が入ったUSBとパソコンが何者かによって盗まれてしまう。

それらを見つける手掛かりは残された暗号のみ。

教授からは、「明日の発表会までに見つけ出してくれ」と言われる。

主人公は、研究発表会を成功させることができるのか？

プレイヤーは、研究室に残された様々な仕掛けを元にミッションをクリアしよう！

      </div>

    </div>


    <!-- スキップ案内 -->
    <div id="skipHint">
      タップするとエピローグをスキップできます
    </div>


    <!-- スキップボタン -->
    <button
      id="closeEpilogueButton"
      type="button"
    >
      スキップ
    </button>

  </section>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
