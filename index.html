<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>学園ミステリー脱出ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ゲーム画面 -->
  <main id="gameScreen" class="screen">
    <div id="timer" aria-live="polite">10:00</div>

    <!-- 長押しで音声認識するボタン -->
    <button
      id="imageButton"
      type="button"
      aria-label="ボタンを長押しして音声認識"
    >
      <img src="botton.png" alt="">
    </button>

    <!-- USB認識後のメッセージ -->
    <div id="voiceResult" aria-live="polite"></div>

    <!-- エピローグを再表示 -->
    <button id="epilogueButton" type="button">
      エピローグ
    </button>
  </main>

  <!-- エピローグ画面 -->
  <section id="epilogueScreen" class="screen hidden">
    <h1 id="epilogueTitle">EPILOGUE</h1>

    <div id="epilogueViewport">
      <div id="epilogueText"></div>
    </div>

    <div id="skipHint">画面をタップすると閉じます</div>

    <!-- エピローグ2を表示 -->
    <button id="epilogue2Button" type="button">
      エピローグ2
    </button>

    <!-- ゲーム画面に戻る -->
    <button id="closeEpilogueButton" type="button">
      閉じる
    </button>
  </section>

  <script src="script.js"></script>
</body>
</html>
